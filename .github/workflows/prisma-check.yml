name: Prisma Cloud Checkov Scan
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  checkov-scan:
    name: Run Checkov with Prisma Cloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Pull Docker image
        run: docker pull abdo01145/shopping:latest
      - name: Prisma Cloud image scan
        id: scan
        uses: PaloAltoNetworks/prisma-cloud-scan@v1.5
        with:
          pcc_console_url: "https://twistlock.pcs.lab.twistlock.com:8083"
          pcc_user: "abmahmoud_sb"
          pcc_pass: "Admin12345678!@"
          image_name: abdo01145/shopping:latest

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 37.27.243.251
          username: root
          password: "AdminP@$$w0rd"
          port: "22"
          script: |
            docker pull abdo01145/shopping:latest
            echo "hello"
