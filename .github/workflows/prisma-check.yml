name: Prisma Cloud Checkov Scan
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  checkov-scan:
    name: Run Checkov with Prisma Cloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Pull Docker image
        run: docker pull abdo01145/shopping:latest
      - name: Prisma Cloud image scan
        id: scan
        uses: PaloAltoNetworks/prisma-cloud-scan@v1.5
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
        with:
          pcc_console_url: "https://135.181.150.101:31678"
          pcc_user: "admin"
          pcc_pass: "AdminP@$$w0rd"
          image_name: abdo01145/shopping:latest
      - name: Upload scan results
        if: ${{ !cancelled() }}      # so results upload even when the scan fails the build
        uses: actions/upload-artifact@v4
        with:
          name: prisma-scan-results
          path: |
            ${{ github.workspace }}/pcc_scan_results.json
            ${{ github.workspace }}/pcc_scan_results.sarif.json
