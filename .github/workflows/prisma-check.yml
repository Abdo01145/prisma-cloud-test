name: Prisma Cloud Checkov Scan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  checkov-scan:
    name: Run Checkov with Prisma Cloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v2
      - name: Pull Docker image
        run: docker pull abdo01145/shopping:latest

      - name: Prisma Cloud image scan
#        env:
#          NODE_TLS_REJECT_UNAUTHORIZED: "0"
        id: scan
        uses: PaloAltoNetworks/prisma-cloud-scan@v1.5
        with:
          pcc_console_url: "https://twistlock.pcs.lab.twistlock.com:8083"
          pcc_user: "abmahmoud_ab"
          pcc_pass: "Admin12345678!@#"
          image_name: abdo01145/shopping:latest

